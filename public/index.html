<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=880">
<meta name="robots" content="noindex,nofollow">
<title>ใบรับรองแพทย์ | W Medical Hospital</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-width:880px;background:#8a8f98;font-family:Sarabun,system-ui,sans-serif;color:#000;padding:10px 0 40px}
.bar{width:860px;margin:0 auto 10px;padding:11px 16px;border-radius:11px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;color:#fff}
.bar .ic{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;flex:0 0 24px;font-size:14px}
.bar small{display:block;font-weight:400;opacity:.9;font-size:12px}
.ok{background:#0f7a4d}.wn{background:#8a5a00}.bad{background:#a11d1d}
.sheet{box-shadow:0 4px 20px rgba(0,0,0,.25)}
.msg{width:860px;margin:0 auto;background:#fff;border-radius:12px;padding:46px 24px;text-align:center}
.msg h2{color:#a11d1d;font-size:18px;margin-bottom:8px}
.msg p{font-size:14px;color:#555}
.home{width:560px;margin:8vh auto 0;background:#fff;border-radius:16px;padding:36px 34px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.25)}
.home img{width:74px;margin-bottom:12px}
.home h1{font-size:20px;color:#12428f;margin-bottom:4px}
.home p.s{font-size:13.5px;color:#657288;margin-bottom:20px}
.home form{display:flex;gap:8px}
.home input{flex:1;padding:11px 14px;border:1.5px solid #d7e0ee;border-radius:10px;font-family:inherit;font-size:16px;text-align:center;letter-spacing:1px}
.home input:focus{outline:0;border-color:#12428f}
.home button{padding:11px 22px;border:0;border-radius:10px;background:#12428f;color:#fff;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}
.home .hint{font-size:12px;color:#98a2b5;margin-top:16px;line-height:1.7}
.pv{width:560px;margin:0 auto;background:#fff;border-radius:16px;padding:30px 34px;box-shadow:0 4px 20px rgba(0,0,0,.25)}
.pv h2{color:#0f7a4d;font-size:18px;margin-bottom:14px;text-align:center}
.pv table{width:100%;border-collapse:collapse;font-size:14px}
.pv td{padding:7px 4px;border-bottom:1px solid #f1f4f8}
.pv td:first-child{color:#657288;width:42%}
.pv .note{background:#eef3fb;border-radius:10px;padding:12px 16px;font-size:12.5px;color:#0b2f68;margin-top:16px;line-height:1.7}
.pv .again{text-align:center;margin-top:14px;font-size:13px}
.foot{width:860px;margin:12px auto 0;text-align:center;color:#fff;font-size:12px;line-height:1.7;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.foot a{color:#fff}
</style>
</head>
<body>
<div id="app"><div class="msg" style="color:#555"><p>กำลังตรวจสอบ…</p></div></div>
<p class="foot">ข้อมูลนี้เป็นข้อมูลส่วนบุคคลด้านสุขภาพ คุ้มครองตาม พ.ร.บ. คุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562<br>
สอบถามเพิ่มเติม โทร. <a href="tel:034110988">034-110-988</a> · <a href="tel:0819023540">081-902-3540</a></p>
<script src="/config.js"></script>
<script src="/cert.js"></script>
<script>document.head.insertAdjacentHTML("beforeend","<style>"+CERT_CSS+"</style>");</script>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var hn = q.get('id') || (location.pathname.match(/(\d{6,})/)||[])[1] || '';
  var tk = q.get('k') || '';
  var app = document.getElementById('app');

  function fail(title, detail){
    app.innerHTML = '<div class="msg"><h2>'+title+'</h2><p>'+detail+'</p></div>'
      + '<p class="foot" style="margin-top:14px"><a href="/">← ตรวจสอบใบอื่น</a></p>';
  }
  function home(){
    document.body.style.minWidth = '0';
    app.innerHTML = ''
    + '<div class="home">'
    +   '<img src="/logo.png" alt="โรงพยาบาล ดับเบิ้ลยู เมดิคอล">'
    +   '<h1>ตรวจสอบใบรับรองแพทย์</h1>'
    +   '<p class="s">โรงพยาบาล ดับเบิ้ลยู เมดิคอล</p>'
    +   '<form id="hf"><input id="hq" inputmode="numeric" placeholder="กรอกเลขที่ใบรับรองแพทย์ 10 หลัก" autofocus><button type="submit">ตรวจสอบ</button></form>'
    +   '<div class="hint">การกรอกเลขที่จะแสดงเฉพาะผลยืนยันขั้นต้น (ใบมีจริง/หมดอายุ/ถูกยกเลิก)<br>'
    +   'หากต้องการดูใบรับรองฉบับเต็ม กรุณาสแกน QR code บนใบรับรอง</div>'
    + '</div>';
    document.getElementById('hf').addEventListener('submit', function(e){
      e.preventDefault();
      var v = document.getElementById('hq').value.replace(/\D/g,'');
      if(v) location.href = '/?id=' + v;
    });
  }
  function preview(c){
    document.body.style.minWidth = '0';
    var s = certStatus(c);
    var conf = c.confirmed
      ? '<td style="color:#0f7a4d;font-weight:600">✓ ยืนยันโดยเจ้าหน้าที่แล้ว</td>'
      : '<td style="color:#8a5a00">ยังไม่ได้รับการยืนยันจากเจ้าหน้าที่</td>';
    app.innerHTML =
      '<div class="bar '+s.cls+'" style="width:560px"><span class="ic">'+s.ic+'</span><span>'+s.head+'<small>'+s.sub+'</small></span></div>'
      + '<div class="pv">'
      + '<h2>✓ ใบรับรองเลขที่ '+esc(c.hn)+' มีอยู่จริงในระบบ</h2>'
      + '<table>'
      + '<tr><td>ออกโดย</td><td>โรงพยาบาล ดับเบิ้ลยู เมดิคอล</td></tr>'
      + '<tr><td>วันที่ตรวจ</td><td>'+thDate(c.exam_date)+'</td></tr>'
      + '<tr><td>ใช้ได้ถึง</td><td>'+thDate(addDays(c.exam_date, c.valid_days||90))+'</td></tr>'
      + '<tr><td>สถานะ</td><td>'+(c.status==='void'?'<span style="color:#a11d1d;font-weight:600">ถูกยกเลิกโดยโรงพยาบาล</span>':esc(s.head))+'</td></tr>'
      + '<tr><td>การยืนยันข้อมูล</td>'+conf+'</tr>'
      + '</table>'
      + '<div class="note">เพื่อคุ้มครองข้อมูลส่วนบุคคลของผู้รับการตรวจ หน้านี้แสดงเฉพาะผลยืนยันขั้นต้น<br>'
      + '<b>ต้องการดูใบรับรองฉบับเต็ม (ชื่อ-สกุล รูปถ่าย ผลตรวจ):</b> สแกน QR code บนใบรับรองแพทย์ฉบับจริง</div>'
      + '<div class="again"><a href="/">← ตรวจสอบใบอื่น</a></div>'
      + '</div>';
  }
  if(!hn){ return home(); }

  fetch(CFG.url + '/rest/v1/rpc/verify_certificate', {
    method: 'POST',
    headers: { 'apikey': CFG.key, 'Authorization': 'Bearer ' + CFG.key, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_hn: hn, p_token: tk })
  })
  .then(function(r){ return r.json(); })
  .then(function(c){
    if(!c){ return fail('ไม่พบใบรับรองแพทย์ฉบับนี้',
      'เลขที่ <b>'+esc(hn)+'</b> ไม่มีอยู่ในระบบ หรือลิงก์ไม่ถูกต้อง<br>กรุณาตรวจสอบอีกครั้ง หรือติดต่อโรงพยาบาลเพื่อยืนยัน'); }
    if(c.preview){ return preview(c); }
    var s = certStatus(c);
    app.innerHTML =
      '<div class="bar '+s.cls+'"><span class="ic">'+s.ic+'</span><span>'+s.head+'<small>'+s.sub+'</small></span></div>'
      + renderCert(c, {});
  })
  .catch(function(){ fail('เชื่อมต่อระบบไม่ได้','กรุณาลองใหม่อีกครั้ง หรือติดต่อโรงพยาบาล โทร. 034-110-988'); });
})();
</script>
</body>
</html>
